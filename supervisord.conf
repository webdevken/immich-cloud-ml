[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:tailscaled]
# 1. The background networking daemon (Runs continuously)
command=/usr/sbin/tailscaled --tun=userspace-networking --state=/workspace/tailscale.state
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/tailscaled.err.log
stdout_logfile=/var/log/supervisor/tailscaled.out.log

[program:tailscale-up]
# 2. The dependent one-shot authentication script
command=/bin/sh -c "while ! tailscale status >/dev/null 2>&1; do sleep 1; done; if ! tailscale status | grep -q 'Logged in'; then if [ -n \"$TS_AUTHKEY\" ]; then tailscale up --authkey=\"$TS_AUTHKEY\" --ssh; fi; fi"
autostart=true
autorestart=false
startsecs=0
priority=10
stderr_logfile=/var/log/supervisor/tailscale-auth.err.log
stdout_logfile=/var/log/supervisor/tailscale-auth.out.log

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
# Ensures model weights are downloaded to the persistent RunPod volume
environment=OLLAMA_MODELS="/workspace/ollama_models"
stderr_logfile=/var/log/supervisor/ollama.err.log
stdout_logfile=/var/log/supervisor/ollama.out.log

[program:immich-ml]
# Executes the default start command for the Immich ML container
command=python -m immich_ml
directory=/usr/src/app
autostart=true
autorestart=true
# Ensures ML models are cached in persistent storage
environment=MACHINE_LEARNING_CACHE_FOLDER="/workspace/immich_cache"
stderr_logfile=/var/log/supervisor/immich-ml.err.log
stdout_logfile=/var/log/supervisor/immich-ml.out.log