[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:tailscale]
# Runs our intelligent wrapper script that handles booting and conditional login internally
command=/usr/local/bin/start-tailscale.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/tailscale.err.log
stdout_logfile=/var/log/supervisor/tailscale.out.log
priority=10

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
# Ensures model weights are downloaded to the persistent RunPod volume
environment=OLLAMA_MODELS="/workspace/ollama_models"
stderr_logfile=/var/log/supervisor/ollama.err.log
stdout_logfile=/var/log/supervisor/ollama.out.log

[program:immich-ml]
# Executes the default start command for the Immich ML container
command=python -m immich_ml
directory=/usr/src/app
autostart=true
autorestart=true
# Ensures ML models are cached in persistent storage
environment=MACHINE_LEARNING_CACHE_FOLDER="/workspace/immich_cache"
stderr_logfile=/var/log/supervisor/immich-ml.err.log
stdout_logfile=/var/log/supervisor/immich-ml.out.log